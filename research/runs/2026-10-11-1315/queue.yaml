runs:
  - id: 2026-10-11-1315-prepare
    cmd: >-
      RAYON_NUM_THREADS=1 .venv/bin/python -m experiments.chem_tape.rectified_run prepare
      --workers 11 --seconds 870
    timeout_seconds: 900
    expect_outputs:
      - bank.json
      - method_freeze.json
      - schedules.json
      - seed_audit.json
      - acquisition.jsonl
      - libraries.json
      - preparation.json
    track: chem-tape
    notes: >-
      Reload/hash-check the complete frozen nine-token rectifier screen;
      validate interpreter/Python/production-VM agreement and worktree import path
      before acquisition. Eight fixed builds times 24 source cells times two
      R-tree jobs (384 jobs); charge every failure and retain empty libraries.
      Unchanged uncapped semantic extraction with reporting-only rectifier vectors.
      Freeze method/priors/seeds, source-only provenance and helper pipeline census.
      No protected searches or source selection by yield.
  - id: 2026-10-11-1315-score
    cmd: >-
      RAYON_NUM_THREADS=1 .venv/bin/python -m experiments.chem_tape.rectified_run score
      --prepared "$RUN_DIR/../2026-10-11-1315-prepare" --workers 11 --seconds 2370
    timeout_seconds: 2400
    expect_outputs:
      - bank.json
      - method_freeze.json
      - libraries.json
      - schedules.json
      - score.jsonl
      - report.json
      - dynamics.png
    track: chem-tape
    notes: >-
      Fail closed on preparation/method/artifact/seed disagreement and reconstruct
      every new library from its own source rows. Eight builds times six development
      cells times two repeats times four seed-paired arms (384 jobs, 96 per arm):
      R-tree, uniform twelve-helper R-rect, new R-all and unchanged 1228 R-all builds 0–7.
      Require the complete grid; descriptive paired whole-build bootstrap of ratios
      of capped arithmetic means. Keep source acquisition and transported historical
      costs visible. Advisory investment thresholds only; protected roster unsearched;
      return every outcome to strategy with no automatic continuation.
