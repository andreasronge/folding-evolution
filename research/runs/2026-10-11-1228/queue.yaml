runs:
  - id: 2026-10-11-1228-prepare
    cmd: >-
      RAYON_NUM_THREADS=1 .venv/bin/python -m experiments.chem_tape.order_cap_run prepare
      --workers 10 --seconds 1170
    timeout_seconds: 1200
    expect_outputs:
      - bank.json
      - method_freeze.json
      - schedules.json
      - seed_audit.json
      - acquisition.jsonl
      - libraries.json
      - preparation.json
    track: chem-tape
    notes: >-
      Hash-check and reload the frozen 1129 bank without re-screening.
      Acquire 24 independent builds, 24 source cells times two R-tree jobs
      each (1152 jobs), retaining failures and empty libraries. Construct
      capped R-S and uncapped R-all from each identical corpus and validate
      the exact prefix, all-eligible pool and corpus provenance.
  - id: 2026-10-11-1228-score
    cmd: >-
      RAYON_NUM_THREADS=1 .venv/bin/python -m experiments.chem_tape.order_cap_run score
      --prepared "$RUN_DIR/../2026-10-11-1228-prepare" --workers 10 --seconds 5370
    timeout_seconds: 5400
    expect_outputs:
      - bank.json
      - method_freeze.json
      - libraries.json
      - schedules.json
      - score.jsonl
      - report.json
      - dynamics.png
    track: chem-tape
    notes: >-
      Fail closed unless preparation hashes, seeds, methods and source-only
      library reconstruction match. Score six development cells times 24
      builds times four repeats times four seed-paired arms (2304 jobs).
      Preserve completed rows on failure; require the complete grid before
      inference. Bootstrap paired whole builds for the pooled arithmetic
      R-all/R-tree ratio. Lower >0.67 takes precedence over upper <0.80.
      No protected search or automatic follow-up.
