runs:
  - id: 2026-10-06-1603-four-reducer-family
    cmd: >-
      RAYON_NUM_THREADS=1 .venv/bin/python -m experiments.chem_tape.four_reducer_run
      --workers 10 --deadline-seconds 12600
    timeout_seconds: 14400
    track: chem-tape
    expect_outputs:
      - config.json
      - maps.json
      - roster.json
      - validation.json
      - stage_a.json
      - bank.json
      - search.jsonl
      - calibration.json
      - checkpoint_b1.json
      - blocks.json
      - gates.json
      - fresh_scores.json
      - summary.json
      - summary.md
      - curves.png
      - contrasts.png
    notes: >-
      Approved FIRST bank: all three domains screened through depth 9, only D1331
      selected, 50 paired seeds per retained cell and all eight fixed arms at P=256,
      length 32, cap 524288. Conditional two-trajectory-per-family multiplier pilot
      gates only on split/headroom/tractability/complete projected cost.
      FIRST validation and all maps frozen before screening; serial fresh-process
      memory-bounded screens, ten search workers with one Rayon thread each.
      First-block projection can skip C; partial work is unresolved.
      Internal deadline 3.5 h including 180 s report reserve; timeout 4 h.
      Every artifact path derives from RUN_DIR. Grammar contrast gates nothing.
