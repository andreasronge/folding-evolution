runs:
  - id: 2026-10-05-2247-composition-bank
    cmd: >-
      RAYON_NUM_THREADS=1 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
      .venv/bin/python -m experiments.chem_tape.composition_run --workers 8
    timeout_seconds: 10800
    expect_outputs:
      - result.json
      - summary.md
      - curves.png
    track: chem-tape
    notes: >-
      Approved composition-bank feasibility. Fixed seeds; full 50-seed blocks,
      524288-evaluation cap, gated 100-seed top-ups, 160-minute internal
      deadline with a 5-minute output reserve. All outputs use RUN_DIR.
      A completed alias failure may stop before search; incomplete data is
      explicitly unresolved. Expected queue wall time approximately 60 minutes.
