  - {arm: BP_TOPK, topk: 3, bond_protection_ratio: 0.5, tape_length: 32, mutation_rate: 0.03, alphabet: v2_imax}
  - {arm: BP_TOPK, topk: 3, bond_protection_ratio: 0.5, tape_length: 32, mutation_rate: 0.03, alphabet: v2_imax, op_weights: "22:4"}
