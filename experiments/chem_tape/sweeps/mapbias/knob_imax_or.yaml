sweep_name: knob_imax_or
# Map-bias notebook §15c: frequency knob on the stack baseline's one-op OR join.
# or_basectrl's v2_imax arm (18/30) with IMAX (id 22) at 1/4, 1x and 4x weight.
base:
  task: mbs_or
  generations: 1500
  disable_early_termination: true
  n_examples: 64
  holdout_size: 256
  pop_size: 1024
  elite_count: 2
  crossover_rate: 0.7
  selection_mode: lexicase
  backend: numpy
  log_every: 50
  track_lineage: true
  fitness_metric: balanced
  fast_rng: true
paired:
