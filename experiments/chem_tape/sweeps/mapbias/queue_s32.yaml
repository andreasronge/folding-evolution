  timeout_seconds: 2400
  expect_outputs: [SWEEP_COMPLETE]
  track: map-bias
  notes: "notebook §32 arm K: one shared copy vs partly + unread B, crossover 0 and 0.3, 100 seeds"

- id: mapbias_s32_latent_alone
