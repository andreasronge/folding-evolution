# Map-bias §29 queue (Plans/shared-helper-reuse.md stage 3; Plans/night-2026-10-02-shared-helper.md).
# Entries in priority order: seed-mixed (main readout), seed-shared, seed-dup. 30 seeds, 1000
# generations each. Pilot (2 seeds/arm, 10 workers): 86-175 s per run; timeouts = 3x estimate
# (ceil(runs/10) waves x 175 s x 3, rounded up). Launch:
#   caffeinate -s uv run python scripts/run_queue.py --queue experiments/chem_tape/sweeps/mapbias/queue_s29.yaml \
#     --status experiments/chem_tape/sweeps/mapbias/queue_s29.status.json --lock experiments/chem_tape/sweeps/mapbias/queue_s29.lock

- id: mapbias_s29_seed_mixed
  cmd: uv run python experiments/chem_tape/sweep.py experiments/chem_tape/sweeps/mapbias/s29_seed_mixed.yaml --output-root "$RUN_DIR" --workers 10
  timeout_seconds: 3600
  expect_outputs: [SWEEP_COMPLETE]
  track: map-bias
  notes: "notebook §29 stage 3: seed-mixed (half shared, half duplicated), L 64 and 128, 30 seeds"

- id: mapbias_s29_seed_shared
  cmd: uv run python experiments/chem_tape/sweep.py experiments/chem_tape/sweeps/mapbias/s29_seed_shared.yaml --output-root "$RUN_DIR" --workers 10
  timeout_seconds: 4800
  expect_outputs: [SWEEP_COMPLETE]
  track: map-bias
  notes: "notebook §29 stage 3: seed-shared, L 32, 64 and 128, 30 seeds"

- id: mapbias_s29_seed_dup
  cmd: uv run python experiments/chem_tape/sweep.py experiments/chem_tape/sweeps/mapbias/s29_seed_dup.yaml --output-root "$RUN_DIR" --workers 10
  timeout_seconds: 3600
  expect_outputs: [SWEEP_COMPLETE]
  track: map-bias
  notes: "notebook §29 stage 3: seed-dup, L 64 and 128, 30 seeds"
