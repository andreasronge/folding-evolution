# Map-bias §15 queue: frequency knob (op_weights) and XOR. All sweeps fast_rng. Launch:
#   caffeinate -s uv run python scripts/run_queue.py --queue experiments/chem_tape/sweeps/mapbias/queue_s15.yaml \
#     --status experiments/chem_tape/sweeps/mapbias/queue_s15.status.json --lock experiments/chem_tape/sweeps/mapbias/queue_s15.lock
# Priority order: core knob + XOR first, seed top-ups last (they may be cut by morning).
# Each sweep writes SWEEP_COMPLETE only when all configs have results; re-running a sweep resumes.

- id: mapbias_knob_comb_and
  cmd: uv run python experiments/chem_tape/sweep.py experiments/chem_tape/sweeps/mapbias/knob_comb_and.yaml --output-root "$RUN_DIR" --workers 10
  timeout_seconds: 7200
  expect_outputs: [SWEEP_COMPLETE]
  track: map-bias
  notes: "notebook §15a: marker frequency vs route choice on AND"

