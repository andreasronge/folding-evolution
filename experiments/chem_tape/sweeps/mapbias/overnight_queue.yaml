# Map-bias overnight queue (notebook §11). Launch:
#   caffeinate -s uv run python scripts/run_queue.py --queue experiments/chem_tape/sweeps/mapbias/overnight_queue.yaml \
#     --status experiments/chem_tape/sweeps/mapbias/overnight_queue.status.json \
#     --lock experiments/chem_tape/sweeps/mapbias/overnight_queue.lock
# Each sweep writes SWEEP_COMPLETE only when every config has a result. A timed-out
# entry resumes by re-running its cmd with the same --output-root (finished configs
# are skipped). Timeouts are ceilings; the pilot estimates ~35 / 70 / 70 / 90 min.

- id: mapbias_or_race
  cmd: uv run python experiments/chem_tape/sweep.py experiments/chem_tape/sweeps/mapbias/or_race.yaml --output-root "$RUN_DIR" --workers 10
  timeout_seconds: 10800
  expect_outputs: [SWEEP_COMPLETE]
  track: map-bias
  notes: "notebook §11 overnight #1: OR race, stratified inputs, 3 arms x 30 seeds x 1500 gens"

- id: mapbias_mvg_p20
  cmd: uv run python experiments/chem_tape/sweep.py experiments/chem_tape/sweeps/mapbias/mvg_p20.yaml --output-root "$RUN_DIR" --workers 10
  timeout_seconds: 14400
  expect_outputs: [SWEEP_COMPLETE]
  track: map-bias
  notes: "notebook §11 overnight #2: varying goals max>5 -> sum>10 -> AND every 20 gens, 3 arms x 30 x 3000"

- id: mapbias_and_fixed
  cmd: uv run python experiments/chem_tape/sweep.py experiments/chem_tape/sweeps/mapbias/and_fixed.yaml --output-root "$RUN_DIR" --workers 10
  timeout_seconds: 14400
  expect_outputs: [SWEEP_COMPLETE]
  track: map-bias
  notes: "notebook §11 overnight #3: fixed AND control, 3 arms x 30 x 3000"

- id: mapbias_mvg_period
  cmd: uv run python experiments/chem_tape/sweep.py experiments/chem_tape/sweeps/mapbias/mvg_period.yaml --output-root "$RUN_DIR" --workers 10
  timeout_seconds: 14400
  expect_outputs: [SWEEP_COMPLETE]
  track: map-bias
  notes: "notebook §11 overnight #4: optional: MVG periods 5 and 50, 2 arms x 30 x 3000"
