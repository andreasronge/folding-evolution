  generations: 3000
  n_examples: 64
  holdout_size: 256
  pop_size: 1024
  elite_count: 2
  crossover_rate: 0.7
  selection_mode: lexicase
  backend: numpy
  log_every: 50
  track_lineage: true
  fitness_metric: balanced
  fast_rng: true
